<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f14"/>
      <stop offset="100%" stop-color="#0f1923"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0085ff"/>
      <stop offset="100%" stop-color="#0073e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0085ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0085ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- الخلفية -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- حلقات متشابكة (رمز الشعار) -->
  <g transform="translate(600,210)" opacity="0.95">
    <circle cx="-32" cy="0" r="46" fill="none" stroke="#0085ff" stroke-width="11"/>
    <circle cx="32" cy="0" r="46" fill="none" stroke="#0073e6" stroke-width="11"/>
  </g>

  <!-- اسم المنصة بالعربية -->
  <text x="600" y="360" font-family="'IBM Plex Sans Arabic','Noto Sans Arabic','Arial',sans-serif"
        font-size="92" font-weight="800" fill="url(#textGrad)" text-anchor="middle"
        direction="rtl">علاقات</text>

  <!-- الوصف -->
  <text x="600" y="430" font-family="'IBM Plex Sans Arabic','Noto Sans Arabic','Arial',sans-serif"
        font-size="30" font-weight="500" fill="#7a8fa6" text-anchor="middle"
        direction="rtl">لتسهيل الخدمات تحتاج علاقات</text>

  <!-- خط فاصل سفلي -->
  <rect x="500" y="480" width="200" height="4" rx="2" fill="#1e2d3d"/>

  <!-- نص إنجليزي صغير سفلي (احتياطي لضمان وضوح الهوية حتى بدون خط عربي) -->
  <text x="600" y="540" font-family="Arial,sans-serif" font-size="22" font-weight="700"
        fill="#3d5269" text-anchor="middle" letter-spacing="4">ALAGAT.COM</text>
</svg>
